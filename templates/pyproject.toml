[project]
name = "{{PROJECT_NAME}}-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.6",
    "xgboost>=3.2",
    "lightgbm>=4.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

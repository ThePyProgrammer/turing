[project]
site_name = "Turing"
site_url = "https://thepyprogrammer.github.io/turing/"
site_description = "The research assistant that can't fool itself. Autonomous ML research harness — 74 commands, 2 agents, 1986 tests."
site_author = "Prannaya Gupta"
copyright = "&copy; 2026 Prannaya Gupta"
extra_css = ["stylesheets/home.css"]
nav = [
  {"Home" = "index.md"},
  {"Philosophy" = [
    "philosophy/index.md",
    "philosophy/taste-leverage.md",
    "philosophy/separation.md",
    "philosophy/memory.md",
    "philosophy/heritage.md",
  ]},
  {"Getting Started" = [
    "getting-started/index.md",
    "getting-started/quickstart.md",
    "getting-started/configuration.md",
    "getting-started/multi-project.md",
  ]},
  {"Commands" = [
    "commands/index.md",
    "commands/core.md",
    "commands/taste-leverage.md",
    "commands/statistical-rigor.md",
    "commands/experiment-intelligence.md",
    "commands/performance.md",
    "commands/research-workflow.md",
    "commands/orchestration.md",
    "commands/deep-analysis.md",
    "commands/composition.md",
    "commands/scaling-efficiency.md",
    "commands/meta-intelligence.md",
    "commands/pre-training.md",
    "commands/model-debugging.md",
    "commands/model-surgery.md",
    "commands/archaeology.md",
    "commands/communication.md",
    "commands/collaboration.md",
    "commands/whatif-analysis.md",
    "commands/model-lifecycle.md",
    "commands/operational.md",
  ]},
  {"Architecture" = [
    "architecture/index.md",
    "architecture/experiment-loop.md",
    "architecture/anti-cheating.md",
    "architecture/agents.md",
    "architecture/convergence.md",
    "architecture/hypothesis-database.md",
  ]},
  {"Changelog" = "changelog.md"},
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "toc.follow",
  "search.highlight",
  "search.suggest",
  "content.code.copy",
  "content.code.annotate",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  "content.action.view",
]

[project.theme.palette]
scheme = "slate"
primary = "deep purple"
accent = "amber"

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "lucide/brain-circuit"

[project.extra]
repo_url = "https://github.com/ThePyProgrammer/turing"
repo_name = "ThePyProgrammer/turing"
edit_uri = "edit/main/docs/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ThePyProgrammer/turing"

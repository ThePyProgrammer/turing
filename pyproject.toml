[project]
name = "claude-turing"
version = "4.0.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "pandas>=2.0",
    "scipy>=1.12",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["templates"]

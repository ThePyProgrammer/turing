<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- The coin — slightly tilted for dynamism -->
  <g transform="rotate(-8 64 64)">
    <!-- Coin body -->
    <ellipse cx="64" cy="64" rx="50" ry="50" fill="#ff4d4d"/>
    <!-- Inner rim -->
    <ellipse cx="64" cy="64" rx="42" ry="42" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
    <!-- T stamped into the coin (centered, serif) -->
    <path d="
      M38 44 L90 44 L88 52 L68 52 L68 82 L74 82 L74 88 L54 88 L54 82 L60 82 L60 52 L40 52 Z
    " fill="#fff"/>
    <!-- Top serifs: small brackets at crossbar ends -->
    <rect x="36" y="42" width="6" height="12" rx="1" fill="#fff"/>
    <rect x="86" y="42" width="6" height="12" rx="1" fill="#fff"/>
  </g>
  <!-- Motion lines — it's been flipped -->
  <line x1="100" y1="18" x2="108" y2="10" stroke="#ff4d4d" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="110" y1="28" x2="118" y2="24" stroke="#ff4d4d" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="106" y1="40" x2="114" y2="38" stroke="#ff4d4d" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
</svg>
